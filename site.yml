---
- name: Example playbook
  hosts: workstations
  become: true
  gather_facts: true
  vars:
    path:
      - "{{ ansible_user_dir }}/.local/bin"
      - "{{ ansible_user_dir }}/.cargo/bin"
  environment:
    PATH: "{{ path|join(':') }}:{{ ansible_env.PATH }}:/sbin:/bin"
  pre_tasks:
    # to allow for ansible pipelining functionality
    # https://docs.ansible.com/ansible/2.4/intro_configuration.html#pipelining
    # while this requirement was removed in RHEL, many other distros leave this option enabled
    - name: Disable requiretty for user so automation can run without interruption
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        regexp: "^Defaults    requiretty"
        line: "Defaults:{{ ansible_user_id }}    !requiretty"
        backrefs: false
        backup: false
        validate: "visudo -cf %s"
      when: ansible_user_id != 'root'
      tags: ["sudoers"]

    - name: Display ansible_distribution
      ansible.builtin.debug:
        msg: |
          The host {{ inventory_hostname }} has {{ ansible_distribution }} installed,
          which belongs to the {{ ansible_os_family }} OS family
      tags: ["always"]

    - name: Symlink /etc/os-release to /etc/system-release
      ansible.builtin.file:
        src: /etc/os-release
        dest: /etc/system-release
        state: link
  roles:
    - role: b08x.devworkstation.base
    - role: b08x.devworkstation.desktop
    - role: b08x.llmops.antigravity
      tags: ["antigravity"]
      vars:
        antigravity_state: present
    - role: b08x.devworkstation.libvirt
      tags: ["libvirt", "virt"]
    - role: b08x.devworkstation.containerd
      tags: ["containerd", "virt"]
